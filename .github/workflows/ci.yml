name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Validate shell helper syntax
        run: |
          bash -n scripts/validate-dev.sh
          bash -n scripts/deploy-prod.sh
          bash -n scripts/vision-provider-smoke.sh
          bash -n scripts/provider-capability-smoke.sh
          bash -n scripts/github-feedback-smoke.sh
          bash -n scripts/bootstrap-sg-canon.sh
          bash -n scripts/build-sg0-canon.sh
          bash scripts/deploy-prod.sh --help >/dev/null
          bash scripts/vision-provider-smoke.sh --help >/dev/null
          bash scripts/provider-capability-smoke.sh --help >/dev/null
          bash scripts/github-feedback-smoke.sh --help >/dev/null
          bash scripts/bootstrap-sg-canon.sh --help >/dev/null
          bash scripts/build-sg0-canon.sh --help >/dev/null
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate operator CLIs
        run: |
          python -m amadeus_bot.telemetry_cli --help >/dev/null
          python -m amadeus_bot.vision_smoke --help >/dev/null
          python -m amadeus_bot.provider_capability_smoke --help >/dev/null
          python -m amadeus_bot.github_feedback_smoke --help >/dev/null
          python scripts/inspect_canon_corpus.py --help >/dev/null
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy amadeus_bot
      - name: Test
        run: pytest
      - name: Build
        run: python -m build
